{% set version = "1.3.2" %}

package:
  name: hygeos-core
  version: {{ version }}

source:
  url: https://github.com/hygeos/core/archive/refs/tags/v{{ version }}.tar.gz
  sha256: 6402c15746423501be032512143da7fda9122a923fdb53c49e12fdd8e6d9883b

build:
  number: 0
  script: {{ PYTHON }} -m pip install . -vv
  noarch: python

requirements:
  host:
    - python {{ python_min }}
    - pip
    - poetry-core >=1
  run:
    - python >={{ python_min }}
    - dask
    - h5netcdf
    - lxml
    - matplotlib-base
    - numba
    - python-dotenv
    - scipy
    - toml
    - tqdm
    - xarray

test:
  imports:
    - core
  requires:
    - python {{ python_min }}
    - pip
  commands:
    - pip check

about:
  home: https://github.com/hygeos/core
  summary: "A collection of common procedures for generic programming purposes"
  license: Apache-2.0
  license_file: LICENSE

extra:
  recipe-maintainers:
    - fsteinmetz
    - danschef
